name: Mirror Chyan (Upload)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      channel:
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      arch:
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64

jobs:
  mirrorchyan_uploading:
    runs-on: macos-latest

    steps:
      - run: echo "Binary upload is disabled; build locally with scripts/build-all.ps1."
