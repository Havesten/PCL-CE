name: Release publish

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 2.14.2)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "v${{ inputs.version }}"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body_path: CHANGELOG.md
          prerelease: ${{ inputs.configuration == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [build, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
